[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frend"
dynamic = ["version"]
description = "The front end: text normalization over tiergraph and icukit"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = "BSD-2-Clause AND CC-BY-SA-4.0 AND Unicode-3.0 AND Apache-2.0 AND LicenseRef-Festival AND LicenseRef-IANA-public"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["text-normalization", "verbalization", "tts", "i18n", "tiergraph", "icukit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
# Floors only, deliberately uncapped: a sibling release that breaks frend should break
# frend's tests where it can be seen, not be held back silently by a cap.
# icukit 0.10.1 is the floor: bounded regexes, attributed sentence breaking,
# behavior loading, reflow, linear streams, offset conversion, and unit surfaces are required.
# phonenumbers 9.0.41 is the floor: its tested regional metadata gates telephone spans.
# tiergraph 0.9.0 is the floor: frend uses the shared path-index parser and compiled order.
# cartlet 0.8 is the floor: opt-in sentence models use its compiled decision trees.
dependencies = [
    "cartlet>=0.8",
    "icukit>=0.10.1",
    "phonenumbers>=9.0.41",
    "tiergraph>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/lenzo-ka/frend"
Repository = "https://github.com/lenzo-ka/frend"
Issues = "https://github.com/lenzo-ka/frend/issues"

[project.optional-dependencies]
dev = [
    "numpy>=2.0",
    "pytest>=9.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = {attr = "frend.__version__"}

[tool.setuptools.packages.find]
include = ["frend*"]

[tool.setuptools.package-data]
frend = [
    "py.typed",
    "behaviors/*.json",
    # Tables by locale: data/<locale>/ (en, ...) and the cross-locale data/root/.
    "data/*/*.json",
    "data/*/*.txt",
    # The context trees and their index: data/<locale>/context/.
    "data/*/context/*.json",
    "data/*/context/trees/*.cart",
    "data/*/context/trees/*.json",
    "data/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
console_output_style = "times"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I002"]
