[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irn"
dynamic = ["version"]
description = "Intermediate Representation Normalizer: text normalization over tiergraph, icukit, and ipakit"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["text-normalization", "verbalization", "tts", "i18n", "tiergraph", "icukit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
# Floors only, deliberately uncapped: a sibling release that breaks irn should break
# irn's tests where it can be seen, not be held back silently by a cap.
# icukit 0.4.0 is the floor because it is the release irn is verified against.
# OutputPlan first appears in tiergraph 0.2.3.
dependencies = ["icukit>=0.4", "tiergraph>=0.2.3"]

[project.urls]
Homepage = "https://github.com/lenzo-ka/irn"
Repository = "https://github.com/lenzo-ka/irn"
Issues = "https://github.com/lenzo-ka/irn/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = {attr = "irn.__version__"}

[tool.setuptools.packages.find]
include = ["irn*"]

[tool.setuptools.package-data]
irn = [
    "py.typed",
    "data/type_priors.json",
    "data/spoken_priors.json",
    "data/icu_shape_backfill.json",
    "data/exceptions/*.json",
    "data/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I002"]
