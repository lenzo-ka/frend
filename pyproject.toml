[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frend"
dynamic = ["version"]
description = "The front end: text normalization over tiergraph, icukit, and ipakit"
authors = [
    {name = "Kevin Lenzo", email = "kevinlenzo@gmail.com"}
]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.12"
keywords = ["text-normalization", "verbalization", "tts", "i18n", "tiergraph", "icukit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
# Floors only, deliberately uncapped: a sibling release that breaks frend should break
# frend's tests where it can be seen, not be held back silently by a cap.
# icukit 0.8.0 is the floor: the first release with CLDR symbol names (icukit #136).
# OutputPlan first appears in tiergraph 0.2.3.
# The context trees use cartlet format 3, introduced in 0.7.0. Keep the published
# floor at 0.6 until 0.7.0 is on PyPI; this migration branch must not land before then.
dependencies = ["cartlet>=0.6", "icukit>=0.8", "tiergraph>=0.4.2"]

[project.urls]
Homepage = "https://github.com/lenzo-ka/frend"
Repository = "https://github.com/lenzo-ka/frend"
Issues = "https://github.com/lenzo-ka/frend/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = {attr = "frend.__version__"}

[tool.setuptools.packages.find]
include = ["frend*"]

[tool.setuptools.package-data]
frend = [
    "py.typed",
    # Tables by locale: data/<locale>/ (en, ...) and the cross-locale data/root/.
    "data/*/*.json",
    "data/*/*.txt",
    # The context trees and their index: data/<locale>/context/.
    "data/*/context/*.json",
    "data/*/context/trees/*.cart",
    "data/*/context/trees/*.json",
    "data/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["I002"]
